# I bundle della GUI, che 'dist' non sa fare: .app dentro un .dmg su macOS,
# installer NSIS su Windows, .deb e .AppImage su Linux.
#
# Parte sul tag, come il workflow di dist. NON su `release: published`: la
# release la crea dist con il GITHUB_TOKEN, e Actions per non ricorrere su se
# stesso non fa scattare nessun workflow dagli eventi generati da quel token.
# Con quel trigger questo file non e' mai partito, in nessuna release.
#
# Dist e questo girano quindi in parallelo e la release puo' non esistere
# ancora quando i bundle sono pronti: l'upload aspetta che compaia.
name: Bundle GUI

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release su cui caricare i bundle (es. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: macos-14
            formats: app,dmg
          - os: macos-13
            formats: app,dmg
          - os: windows-latest
            formats: nsis,wix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # libpcsclite per la carta, libfuse2 perche' linuxdeploy monta l'AppImage
      # per costruirla.
      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pkg-config libfuse2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # NO_STRIP: lo strip che linuxdeploy si porta dietro non digerisce una
      # libpcsclite con la sezione .relr.dyn e fa fallire l'AppImage.
      - name: Package
        env:
          NO_STRIP: "1"
        run: cargo packager --release -p cie-gui --formats ${{ matrix.formats }} --verbose

      - name: Upload dei bundle sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/*.dmg target/release/*.deb target/release/*.AppImage target/release/*-setup.exe target/release/*.msi)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nessun bundle prodotto in target/release" >&2
            ls -la target/release >&2
            exit 1
          fi
          printf 'Carico: %s\n' "${files[@]}"

          # La release la crea dist, che gira in parallelo a questo workflow.
          # Mezz'ora e' molto piu' di quanto ci mette a costruire cinque target.
          for _ in $(seq 1 60); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            echo "La release $TAG non c'e' ancora, riprovo fra 30s"
            sleep 30
          done
          gh release view "$TAG" > /dev/null || {
            echo "La release $TAG non e' mai comparsa: guarda il workflow Release" >&2
            exit 1
          }

          gh release upload "$TAG" "${files[@]}" --clobber
