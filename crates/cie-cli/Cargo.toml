[package]
name = "cie-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI per la Carta d'Identità Elettronica italiana"

[[bin]]
name = "cie"
path = "src/main.rs"

# L'MSI della sola CLI non si spedisce piu' (vedi dist-workspace.toml): su
# Windows c'e' quello della GUI, che porta dentro anche `cie`. I GUID restano
# qui perche' identificano il prodotto gia' installato da chi aveva la 0.1.4 o
# precedenti: cambiarli farebbe una seconda installazione affiancata.
[package.metadata.wix]
upgrade-guid = "482C7D11-6BCF-4DC5-BAFF-C227F53DAD27"
path-guid = "8A0E8C2B-44B9-4181-B086-32B12BF610EA"
license = false
eula = false

[dependencies]
cie-lib.workspace = true
cie-firma.workspace = true
cie-pgp.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex = "0.4"
rpassword = "7.5"
