[package]
name = "cie-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Libreria core per la Carta d'Identità Elettronica italiana"

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
hex = "0.4"
x509-cert = "0.2"
der = "0.7"

# PC/SC per comunicazione diretta con smart card
pcsc = "2.8"

# Crittografia per Secure Messaging
des = "0.8"           # 3DES
aes = "0.8"           # AES-128
cbc = "0.1"           # CBC mode
sha2 = "0.10"         # SHA-256
hmac = "0.12"         # HMAC
num-bigint = "0.4"    # Big integers per RSA/DH
rand = "0.8"          # Random number generation

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
