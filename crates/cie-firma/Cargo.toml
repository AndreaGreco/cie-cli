[package]
name = "cie-firma"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Firmatario on-card della CIE e contenitori di firma (PAdES, CAdES, detached)"

[dependencies]
cie-lib.workspace = true
anyhow.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

# PAdES e CAdES. Niente feature di rete: senza `tsp` non c'e' nessun client HTTP
# nel percorso di firma, e questo livello continua a parlare solo con la carta.
underskrift = { version = "0.1.4", default-features = false, features = ["visual", "blocking"] }
tokio = { version = "1", features = ["rt"] }
chrono = "0.4"

# Solo per rimettere il lucchetto sulla voce del portachiavi prima di leggerla
# (vedi `keyring::relock`): il crate `keyring` sa aprire, non sa richiudere.
# Stessa versione che usa gia' il suo backend secret-service, quindi non e' una
# dipendenza in piu' nel build.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "5"

# Un firmatario software che imita il contratto della carta (riceve un hash,
# costruisce il DigestInfo, restituisce PKCS#1 v1.5) cosi' il percorso di firma
# si puo' esercitare senza CIE. Dietro una feature perche' serve anche a
# `cie-pgp`, che altrimenti dovrebbe duplicarlo.
[features]
test-signer = ["dep:rsa", "dep:sha2", "dep:rand", "dep:x509-cert", "dep:der", "dep:spki", "dep:signature"]

[dependencies.rsa]
version = "0.9"
features = ["sha2"]
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dependencies.x509-cert]
version = "0.2"
features = ["builder"]
optional = true

[dependencies.der]
version = "0.7"
optional = true

[dependencies.spki]
version = "0.7"
optional = true

[dependencies.signature]
version = "2"
optional = true

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
signature = "2"
