[workspace]
resolver = "2"
members = [
    "crates/cie-lib",
    "crates/cie-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Antonio Greco"]
license = "MIT"
repository = "https://github.com/agreco/cie-cli"
description = "CLI e libreria per la Carta d'Identità Elettronica italiana"

[workspace.dependencies]
# Core dependencies
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PKCS#11
cryptoki = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async (per future estensioni)
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates
cie-lib = { path = "crates/cie-lib" }
