[workspace]
resolver = "2"
members = [
    "crates/cie-lib",
    "crates/cie-firma",
    "crates/cie-cli",
    "crates/cie-gui",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["Attilio Greco"]
license = "MIT"
repository = "https://github.com/AttilioGreco/cie-cli"
description = "CLI e libreria per la Carta d'Identità Elettronica italiana"

[workspace.dependencies]
# Core dependencies
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization (dati del titolare)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Portachiavi di sistema: secret-service su Linux, Credential Manager su
# Windows, Keychain su macOS, dietro la stessa API.
keyring = "4"

# Internal crates
cie-lib = { path = "crates/cie-lib" }
cie-firma = { path = "crates/cie-firma" }

# Fino a che il lavoro non e' a monte: /M nel dizionario di firma, tsp-ltv
# dietro le sue feature, DocMDP implementato e il CAdES standalone (.p7m).
# Il fork sta su git, non su un path locale: la CI di release deve poterlo
# risolvere. Per lavorarci sopra in locale c'e' `.cargo/config.toml` (vedi
# .cargo/config.toml.example).
[patch.crates-io]
underskrift = { git = "https://github.com/AttilioGreco/underskrift", branch = "main" }

# Il profilo con cui 'dist' costruisce i binari di release
[profile.dist]
inherits = "release"
lto = "thin"
