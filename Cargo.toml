[workspace]
resolver = "2"
members = [
    "crates/cie-lib",
    "crates/cie-firma",
    "crates/cie-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Antonio Greco"]
license = "MIT"
repository = "https://github.com/agreco/cie-cli"
description = "CLI e libreria per la Carta d'Identità Elettronica italiana"

[workspace.dependencies]
# Core dependencies
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization (dati del titolare)
serde = { version = "1", features = ["derive"] }

# Internal crates
cie-lib = { path = "crates/cie-lib" }
cie-firma = { path = "crates/cie-firma" }

# Fino a che il lavoro non e' a monte: /M nel dizionario di firma, tsp-ltv
# dietro le sue feature, DocMDP implementato e il CAdES standalone (.p7m).
# Fork: github.com/AttilioGreco/underskrift, branch fix/pades-conformance.
[patch.crates-io]
underskrift = { path = "../underskrift" }
